services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      CALLS_DB_PATH: /app/data/private/calls.sqlite3
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GROQ_REASONING_EFFORT: "${GROQ_REASONING_EFFORT:-medium}"
      GROQ_MODEL: "${GROQ_MODEL:-openai/gpt-oss-120b}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      ANTHROPIC_MODEL: "${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}"
      LLM_TIMEOUT_SECONDS: "${LLM_TIMEOUT_SECONDS:-20}"
      LLM_MAX_RETRIES: "${LLM_MAX_RETRIES:-1}"
    volumes:
      - call-data:/app/data/private
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  call-data:
